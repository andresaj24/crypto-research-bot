[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-research-bot"
version = "1.0.0"
description = "Multi-strategy crypto intelligence system — autonomous token scanning, onchain verification, LLM-powered threat assessment and briefing generation."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "andresaj24" }]
requires-python = ">=3.10"
keywords = ["crypto", "intelligence", "multi-agent", "defi", "llm", "dexscreener"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
cri = "crypto_intel.cli:app"

[project.urls]
Homepage = "https://github.com/andresaj24/crypto-research-bot"
Issues = "https://github.com/andresaj24/crypto-research-bot/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
